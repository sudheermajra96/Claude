const vOf=t=>V0+(V1-V0)*smooth((t-DB0)/(DB1-DB0));
const SA=[0];for(let i=1;i<=T*100+400;i++){const t=i/100;SA.push(SA[i-1]+(vOf(t-0.005))*0.01);}
const sOf=t=>t<0?V0*t:SA[Math.min(SA.length-1,Math.round(t*100))];
const plan=[[0,1],[4.0,2],[8.4,3]],LCD=1.1;
function laneX(t){let x=lanes[plan[0][1]];for(let i=1;i<plan.length;i++)x+=(lanes[plan[i][1]]-lanes[plan[i-1][1]])*smooth((t-plan[i][0])/LCD);return x;}
function ppos(t){const s=sOf(t);if(s<SR)return{x:laneX(t),z:-s};const r=ramp(s);return{x:r.x,z:r.z};}
const signals=[[2.9,5.3],[7.5,9.7]];const sigOn=t=>signals.some(([a,b])=>t>=a&&t<b&&Math.floor((t-a)/0.36)%2==0);
// traffic
const colors=[0xffffff,0xe8e8e8,0x1a1a1a,0x2e5fb0,0xc22b2b,0x9aa0a6,0x6fa0d8,0x3a3a3a,0x7a1f1f,0x2f6b4a];
const traffic=[];
function tryAdd(lane,z0,v,type,dir){const x=dir>0?lanes[lane]:-lanes[lane];
 if(dir>0)for(let t=0;t<=T;t+=0.05){const p=ppos(t),s=sOf(t);if(s>SR+30)break;const cz=z0-v*t;const L=type==='semi'?11:5.5;if(Math.abs(p.z-cz)<L&&Math.abs(p.x-x)<2.9)return;}
 const m=car(type==='semi'||type==='truck'?colors[rnd()*10|0]:colors[rnd()*10|0],type);if(dir<0)m.rotation.y=Math.PI;traffic.push({m,x,z0,v:dir*v,type,dir});}
const ctype=()=>{const r=rnd();return r<.22?'semi':r<.3?'truck':r<.5?'suv':r<.62?'van':r<.82?'sedan':'hatch';};
for(let i=0;i<9;i++)tryAdd(0,70-i*38-rnd()*10,32+rnd()*4,['sedan','suv','hatch','sedan'][i%4],1);
for(let i=0;i<8;i++)tryAdd(1,60-i*55-rnd()*20,25+rnd()*2,ctype(),1);
for(let i=0;i<6;i++)tryAdd(2,-50-i*60-rnd()*15,26+rnd()*2,ctype(),1);
for(let i=0;i<3;i++)tryAdd(2,40+i*45,24.5,ctype(),1);
for(let i=0;i<40;i++)tryAdd(i%3,-20-i*24-rnd()*12,26+rnd()*7,ctype(),-1);
// exit-lane car ahead
{const m=car(0x2e5fb0,'suv');traffic.push({m,ramp:true,s0:330,v:16});}
function tpos(o,t){if(o.ramp){const s=o.s0+o.v*t;const r=ramp(s);return{x:r.x,z:r.z,h:r.h};}return{x:o.x,z:o.z0-o.v*t,h:o.dir<0?Math.PI:0};}
// ---------- audio events ----------
{const ev=[];for(const o of traffic){let prev=1e9,dec=false,best=null;for(let t=0;t<=T+1;t+=0.02){const p=ppos(t),q=tpos(o,t),d=Math.hypot(p.x-q.x,p.z-q.z);
  if(d>prev&&!dec&&prev<45){const p2=ppos(t+0.02),q2=tpos(o,t+0.02),p0=ppos(t-0.02),q0=tpos(o,t-0.02);
   const rv=Math.hypot((q2.x-p2.x)-(q0.x-p0.x),(q2.z-p2.z)-(q0.z-p0.z))/0.04;const h=Math.atan2(p2.x-p0.x,-(p2.z-p0.z));const side=Math.sign((q.x-p.x)*Math.cos(h)+(q.z-p.z)*Math.sin(h));
   ev.push({t:+(t-0.02).toFixed(3),d:+prev.toFixed(2),rv:+rv.toFixed(2),side,type:o.type||'suv',onc:o.dir<0});dec=true;}
  if(d<prev)dec=false;prev=d;}}
 const v=[];for(let i=0;i<=T*100;i++)v.push(+vOf(i/100).toFixed(3));
 const tAtS=s=>{let i=0;while(i<SA.length-1&&SA[i]<s)i++;return i/100;};
 window.audioData={T,passes:ev,v,signals,flash:0.36,overpass:tAtS(OP-9.5),steps:[0,2.9,5.6,7.5,10.0],joints:[tAtS(55),tAtS(240),tAtS(SR+40)],gantry:tAtS(GS)};}
// ---------- captions ----------
const steps=[[0,'Watch for your exit sign — note the exit number'],[2.9,'Check mirrors & blind spot, then signal right'],[5.6,'Move into the right lane early — keep your speed'],[7.5,'Signal again and enter the exit lane'],[10.0,'Only now slow down — follow the ramp speed sign']];
const dots=document.getElementById('dots');steps.forEach(()=>dots.appendChild(document.createElement('div')));
// ---------- frame ----------
window.renderFrame=function(t){
 const p=ppos(t),pa=ppos(t+0.05),pb=ppos(t-0.05),h=Math.atan2(pa.x-pb.x,-(pa.z-pb.z));
 player.position.set(p.x,0,p.z);player.rotation.y=-h;player.rotation.z=-(laneX(t+0.05)-laneX(t-0.05))/0.1*0.006;
 for(const o of traffic){const q=tpos(o,t);o.m.position.set(q.x,0,q.z);o.m.rotation.y=-q.h;}
 const on=sigOn(t);ind.color.setHex(on?0xffa20a:0x6a3a00);brk.color.setHex(t>DB0-0.2&&t<DB1?0xff2a14:0xb01a0c);
 const s=sOf(t),cs=s-9.8,ct=(()=>{let lo=-2,hi=t;for(let k=0;k<30;k++){const m=(lo+hi)/2;if(sOf(m)<cs)lo=m;else hi=m;}return lo;})();
 const c=ppos(ct),dx=p.x-c.x,dz=p.z-c.z,dl=Math.hypot(dx,dz);
 cam.position.set(c.x,4.9,c.z);cam.lookAt(p.x+dx/dl*9,1.1,p.z+dz/dl*9);
 sun.position.set(p.x-45,48,p.z+12);sun.target.position.set(p.x,0,p.z-12);
 document.getElementById('kmh').textContent=Math.round(vOf(t)*3.6);
 document.getElementById('sig').style.opacity=on?1:0.12;
 let k=0;steps.forEach((st,i)=>{if(t>=st[0])k=i;});
 document.getElementById('sn').textContent=`STEP ${k+1} OF ${steps.length}`;document.getElementById('st').textContent=steps[k][1];
 [...dots.children].forEach((d,i)=>d.style.background=i<=k?'#ffd21f':'#444');
 const fade=Math.min(1,(t-steps[k][0])/0.25);document.getElementById('step').style.opacity=k==0?1:fade;
 renderer.render(scene,cam);};
window.renderFrame(0);window.ready=true;
</script></body></html>
