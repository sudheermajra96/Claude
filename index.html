<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dictionnaire</title>
<meta name="description" content="French A1 vocabulary practice and offline French to English dictionary">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dictionnaire">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg:#000; --card:#111; --card2:#1a1a1a; --line:#222; --text:#f2f2f2; --muted:#8a8a8a;
    --accent:#8ab4ff; --good:#4cd07d; --bad:#ff6b6b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font:17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; }
  header { position:sticky; top:0; z-index:1; background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px; border-bottom:1px solid var(--line); }
  h1 { font-size:28px; margin:0 0 10px; letter-spacing:-.5px; }
  h1 span { color:var(--muted); font-weight:400; font-size:17px; margin-left:6px; }
  .bar-title { display:flex; align-items:center; gap:4px; }
  .bar-title h1 { margin:0; font-size:24px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #pback { border:0; background:none; color:var(--accent); font-size:30px; line-height:1; padding:0 8px 4px 0; }
  .search { position:relative; }
  input { width:100%; font-size:17px; padding:12px 40px 12px 14px; border-radius:12px;
    border:1px solid var(--line); background:var(--card); color:var(--text); outline:none; -webkit-appearance:none; }
  input::-webkit-search-cancel-button { -webkit-appearance:none; display:none; }
  input:focus { border-color:var(--accent); }
  #clear { position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none;
    color:var(--muted); font-size:22px; width:34px; height:34px; display:none; }
  main { padding:8px 16px calc(env(safe-area-inset-bottom) + 88px); }
  .section { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.6px; margin:22px 0 8px; }
  .entry { position:relative; padding:12px 48px 12px 0; border-bottom:1px solid var(--line); }
  .head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .word { font-size:20px; font-weight:600; }
  .meta { color:var(--muted); font-size:14px; }
  .trans { margin-top:4px; color:var(--accent); }
  .say { position:absolute; right:0; top:12px; border:1px solid var(--line); background:var(--card);
    border-radius:999px; padding:4px 10px; font-size:14px; }
  .center .say, .qword .say { position:static; vertical-align:middle; font-size:16px; padding:6px 12px; }
  .tick { color:var(--good); font-size:15px; }
  .empty { color:var(--muted); text-align:center; margin-top:48px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; font-size:15px; }
  footer { color:#555; font-size:12px; text-align:center; margin-top:32px; }
  footer a { color:#777; }
  [hidden] { display:none !important; }

  /* Practice */
  .hero { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:12px; }
  .hero-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .big { font-size:30px; font-weight:700; letter-spacing:-.5px; }
  .pill { background:var(--accent); color:#000; font-weight:700; border-radius:999px; padding:4px 12px; font-size:14px; }
  .bar { height:6px; background:#262626; border-radius:99px; overflow:hidden; margin:10px 0 2px; }
  .bar i { display:block; height:100%; background:var(--good); border-radius:99px; transition:width .3s; }
  .row { display:flex; gap:10px; margin-top:14px; }
  .btn { flex:1; border:1px solid var(--line); background:var(--card2); border-radius:12px; padding:13px 10px; font-weight:600; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#000; }
  .btn.wide { width:100%; margin-top:16px; }
  .topic { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; }
  .ico { font-size:26px; width:34px; text-align:center; }
  .tname { flex:1; display:flex; flex-direction:column; font-weight:600; }
  .tname .bar { margin:6px 0 0; height:4px; }
  .chev { color:var(--muted); font-size:24px; }
  .hint { color:#555; font-size:13px; text-align:center; margin-top:20px; }
  .progress { color:var(--muted); font-size:14px; text-align:center; margin-top:12px; }
  .center { text-align:center; margin-top:16px; }
  .card { display:flex; flex-direction:column; justify-content:center; align-items:center; width:100%; min-height:240px;
    margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px; }
  .card .fr { font-size:32px; font-weight:700; text-align:center; }
  .card .en { font-size:22px; color:var(--accent); margin-top:14px; text-align:center; visibility:hidden; }
  .card .tap { color:var(--muted); font-size:14px; margin-top:18px; }
  .card.flipped .en { visibility:visible; }
  .card.flipped .tap { visibility:hidden; }
  .qword { font-size:32px; font-weight:700; text-align:center; margin:28px 0 6px; }
  .opts { display:grid; gap:10px; margin-top:22px; }
  .opt { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px; font-size:18px; text-align:left; }
  .opt.right { border-color:var(--good); background:#0f2a1a; color:var(--good); }
  .opt.wrong { border-color:var(--bad); background:#2a1010; color:var(--bad); }
  .opt:disabled { opacity:1; }
  .result { text-align:center; margin:40px 0 10px; }
  .result .emoji { font-size:56px; }

  /* Vocab game */
  .game-cta { display:flex; align-items:center; gap:14px; width:100%; text-align:left; margin-top:14px; padding:18px 16px;
    border:1px solid #2c3d5c; border-radius:20px; background:linear-gradient(135deg,#14213a,#0b0b0b); }
  .gc-emoji { font-size:40px; }
  .gc-title { font-size:21px; font-weight:700; }
  .gc-sub { color:var(--muted); font-size:14px; font-weight:400; margin-top:2px; }
  .gc-play { background:var(--accent); color:#000; font-weight:700; border-radius:999px; padding:8px 16px; }
  .level { display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:12px; }
  .lvl { font-size:22px; font-weight:800; width:54px; height:54px; border-radius:14px; display:grid; place-items:center;
    background:var(--card2); color:var(--accent); border:1px solid #2c3d5c; flex:none; }
  #feedback { scroll-margin-bottom:calc(env(safe-area-inset-bottom) + 80px); }
  .verdict { margin-top:18px; padding:12px 14px; border-radius:12px; font-weight:600; }
  .verdict.good { background:#0f2a1a; color:var(--good); }
  .verdict.bad { background:#2a1010; color:var(--bad); font-weight:400; }
  .verdict.bad b { font-weight:700; }
  .example { margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--card); border:1px solid var(--line); }
  .ex-label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
  .ex-fr { margin-top:4px; font-size:18px; font-style:italic; }
  .ex-fr .say { position:static; vertical-align:middle; margin-left:4px; padding:2px 8px; }
  .ex-en { color:var(--accent); margin-top:2px; }

  /* Tab bar */
  nav { position:fixed; left:0; right:0; bottom:0; z-index:2; display:flex; background:rgba(10,10,10,.92);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; border:0; background:none; color:var(--muted); padding:8px 0 6px; font-size:11px;
    display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav button span { font-size:22px; filter:grayscale(1); opacity:.6; }
  nav button.on { color:var(--accent); }
  nav button.on span { filter:none; opacity:1; }
</style>
</head>
<body>
<section id="tab-practice">
  <header><div class="bar-title"><button id="pback" aria-label="Back">‹</button><h1 id="ptitle">Learn French</h1></div></header>
  <main id="pview"></main>
</section>
<section id="tab-dict" hidden>
  <header>
    <h1>Dictionnaire <span>French → English</span></h1>
    <div class="search">
      <input id="q" type="search" placeholder="Type a French word…" autocomplete="off" autocorrect="off"
        autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search">
      <button id="clear" aria-label="Clear">×</button>
    </div>
  </header>
  <main id="out"><p class="empty">Loading dictionary…</p></main>
</section>
<nav>
  <button data-tab="practice" class="on"><span>🎓</span>Practice</button>
  <button data-tab="dict"><span>📖</span>Dictionary</button>
</nav>
<script src="app.js"></script>
<script src="a1.js"></script>
<script src="practice.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
<script>
  document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
    for (const t of ["practice", "dict"]) document.getElementById("tab-" + t).hidden = t !== b.dataset.tab;
    window.scrollTo(0, 0);
  }));
</script>
</body>
</html>
