<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dictionnaire</title>
<meta name="description" content="Offline French to English dictionary">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dictionnaire">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg:#000; --card:#111; --line:#222; --text:#f2f2f2; --muted:#8a8a8a; --accent:#8ab4ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font:17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position:sticky; top:0; z-index:1; background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px; border-bottom:1px solid var(--line); }
  h1 { font-size:28px; margin:0 0 10px; letter-spacing:-.5px; }
  h1 span { color:var(--muted); font-weight:400; font-size:17px; margin-left:6px; }
  .search { position:relative; }
  input { width:100%; font-size:17px; padding:12px 40px 12px 14px; border-radius:12px;
    border:1px solid var(--line); background:var(--card); color:var(--text); outline:none; -webkit-appearance:none; }
  input::-webkit-search-cancel-button { -webkit-appearance:none; display:none; }
  input:focus { border-color:var(--accent); }
  #clear { position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none;
    color:var(--muted); font-size:22px; width:34px; height:34px; display:none; }
  main { padding:8px 16px calc(env(safe-area-inset-bottom) + 24px); }
  .section { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.6px; margin:18px 0 6px; }
  .entry { position:relative; padding:12px 48px 12px 0; border-bottom:1px solid var(--line); }
  .head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .word { font-size:20px; font-weight:600; }
  .meta { color:var(--muted); font-size:14px; }
  .trans { margin-top:4px; color:var(--accent); }
  .say { position:absolute; right:0; top:12px; border:1px solid var(--line); background:var(--card); color:var(--text);
    border-radius:999px; padding:4px 10px; font-size:14px; }
  .empty { color:var(--muted); text-align:center; margin-top:48px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:6px 12px; font-size:15px; }
  footer { color:#555; font-size:12px; text-align:center; margin-top:32px; }
  footer a { color:#777; }
</style>
</head>
<body>
<header>
  <h1>Dictionnaire <span>French → English</span></h1>
  <div class="search">
    <input id="q" type="search" placeholder="Type a French word…" autocomplete="off" autocorrect="off"
      autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search">
    <button id="clear" aria-label="Clear">×</button>
  </div>
</header>
<main id="out"><p class="empty">Loading dictionary…</p></main>
<script src="app.js"></script>
</body>
</html>
